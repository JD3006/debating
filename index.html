<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // 1. Fetch latest target directly from GitHub raw (bypasses GitHub API rate limits)
    async function getLatestTarget() {
      const url = `https://raw.githubusercontent.com/JD3006/debating/main/target.json?t=${Date.now()}`;
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("Failed to load target.json");
      const data = await res.json();
      return data?.target;
    }

    // 2. Simple check: verifies the target server is reachable and not returning a 404
    async function isTargetOnline(url) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 6000); // 6s timeout

      try {
        // Attempt standard fetch to inspect status code (e.g. checking for 404)
        const res = await fetch(url, { signal: controller.signal, cache: "no-store" });
        clearTimeout(timeout);
        return res.status !== 404;
      } catch (corsOrNetworkErr) {
        // If standard fetch was blocked by browser CORS, probe with no-cors
        try {
          await fetch(url, { mode: "no-cors", signal: controller.signal, cache: "no-store" });
          clearTimeout(timeout);
          return true; // Server is online and reachable
        } catch (offlineErr) {
          clearTimeout(timeout);
          return false; // Server is down, unreachable, or timed out
        }
      }
    }

    async function checkAndRedirect() {
      const statusElem = document.getElementById("status-message");

      try {
        statusElem.innerText = "Finding website address...";
        const targetUrl = await getLatestTarget();

        if (!targetUrl) {
          throw new Error("Target URL is missing in target.json");
        }

        statusElem.innerText = "Checking if website is online...";
        const isOnline = await isTargetOnline(targetUrl);

        if (isOnline) {
          statusElem.innerText = "Website is online! Redirecting...";
          window.location.replace(targetUrl);
        } else {
          statusElem.innerText = "the website is down pls contact me";
        }
      } catch (err) {
        console.error("Error:", err);
        statusElem.innerText = "the website is down pls contact me";
      }
    }

    window.addEventListener("DOMContentLoaded", checkAndRedirect);
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 60px;">
  <p id="status-message" style="font-size: 1.2rem; color: #333;">Initializing...</p>
</body>
</html>
