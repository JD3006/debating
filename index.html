<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    async function isWebsiteUp(targetUrl, timeoutMs = 6000) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

      // Method 1: Check through corsproxy with ngrok warning bypass header
      try {
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
        const res = await fetch(proxyUrl, {
          headers: { "ngrok-skip-browser-warning": "true" },
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        // ngrok returns 404 or 503 when the tunnel is closed/offline
        if (!res.ok) {
          return false;
        }

        const html = await res.text();
        if (html.includes("ERR_NGROK_") || html.includes("is offline")) {
          return false;
        }

        return true;
      } catch (err) {
        // Method 2: Fallback probe if the first proxy is blocked
        try {
          const fallbackUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}&t=${Date.now()}`;
          const res2 = await fetch(fallbackUrl);
          if (!res2.ok) return false;

          const data = await res2.json();
          if (data.status && data.status.http_code >= 400) {
            return false;
          }

          const contents = data.contents || "";
          if (contents.includes("ERR_NGROK_") || contents.includes("is offline")) {
            return false;
          }

          return true;
        } catch (e) {
          return false;
        }
      }
    }

    async function redirect() {
      const messageElem = document.getElementById("status-message");

      try {
        // 1. Fetch target config from GitHub
        const configUrl = `https://raw.githubusercontent.com/JD3006/debating/main/target.json?t=${Date.now()}`;
        const response = await fetch(configUrl, { cache: "no-store" });

        if (!response.ok) throw new Error("Could not fetch target configuration.");

        const data = await response.json();

        if (!data || !data.target) {
          messageElem.innerText = "the website is down pls contact me";
          return;
        }

        // 2. Check if the ngrok endpoint is actually active and returning 200 OK
        const siteIsAvailable = await isWebsiteUp(data.target);

        if (siteIsAvailable) {
          window.location.replace(data.target);
        } else {
          messageElem.innerText = "the website is down pls contact me";
        }
      } catch (err) {
        console.error(err);
        messageElem.innerText = "the website is down pls contact me";
      }
    }

    window.addEventListener("DOMContentLoaded", redirect);
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">
  <p id="status-message">Checking website availability...</p>
</body>
</html>
