<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    // Fetches the target URL instantly without GitHub's 5-minute raw CDN cache
    async function getLatestTarget() {
      // 1. Primary method: GitHub API (Instant, 0 cache delay)
      try {
        const apiUrl = `https://api.github.com/repos/JD3006/debating/contents/target.json?t=${Date.now()}`;
        const apiRes = await fetch(apiUrl, {
          cache: "no-store",
          headers: {
            "Accept": "application/vnd.github.v3.raw" // Tells GitHub to return the raw JSON file instantly
          }
        });

        if (apiRes.ok) {
          const json = await apiRes.json();
          if (json && json.target) return json.target;
        }
      } catch (e) {
        console.warn("[DEBUG] GitHub API failed, attempting raw fallback...", e);
      }

      // 2. Fallback method: raw.githubusercontent.com
      const rawUrl = `https://raw.githubusercontent.com/JD3006/debating/main/target.json?t=${Date.now()}`;
      const rawRes = await fetch(rawUrl, { cache: "no-store" });
      const rawJson = await rawRes.json();
      return rawJson?.target;
    }

    async function checkAndRedirect() {
      const statusElem = document.getElementById("status-message");

      console.log("%c[DEBUG] Starting redirect check...", "color: #3b82f6; font-weight: bold;");

      try {
        statusElem.innerText = "Fetching latest redirect target...";
        await sleep(500);

        const targetUrl = await getLatestTarget();

        if (!targetUrl) {
          throw new Error("Target URL is missing or could not be loaded.");
        }

        console.log(`%c[DEBUG] Target URL: ${targetUrl}`, "color: #10b981; font-weight: bold;");

        statusElem.innerText = "Checking if website is online...";
        console.log("[DEBUG] Probing target endpoint...");
        await sleep(800);

        let isOnline = false;

        try {
          const probeController = new AbortController();
          const timeout = setTimeout(() => probeController.abort(), 6000);

          const probeRes = await fetch(targetUrl, {
            method: "GET",
            headers: {
              "ngrok-skip-browser-warning": "69420"
            },
            signal: probeController.signal
          });

          clearTimeout(timeout);
          console.log(`[DEBUG] Target HTTP Status: ${probeRes.status}`);

          if (probeRes.ok) {
            isOnline = true;
          } else {
            console.warn(`[DEBUG] Target returned HTTP ${probeRes.status}. ngrok is offline.`);
            isOnline = false;
          }
        } catch (fetchErr) {
          console.warn("[DEBUG] Direct probe failed (tunnel offline or blocked):", fetchErr.message);
          isOnline = false;
        }

        await sleep(500);

        if (isOnline) {
          console.log("%c[DEBUG] Site is online! Redirecting...", "color: #10b981; font-weight: bold;");
          statusElem.innerText = "Website is online! Redirecting...";
          await sleep(600);
          window.location.replace(targetUrl);
        } else {
          console.log("%c[DEBUG] Site is DOWN. Aborting redirect.", "color: #ef4444; font-weight: bold;");
          statusElem.innerText = "the website is down pls contact me";
        }

      } catch (err) {
        console.error("%c[DEBUG] Error:", "color: #ef4444;", err.message);
        statusElem.innerText = "the website is down pls contact me";
      }
    }

    window.addEventListener("DOMContentLoaded", checkAndRedirect);
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 60px;">
  <p id="status-message" style="font-size: 1.2rem; color: #333;">Initializing...</p>
</body>
</html>
