<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    async function isWebsiteUp(url, timeoutMs = 7000) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

      try {
        // Fetch via CORS proxy to read the raw HTML content
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}&t=${Date.now()}`;
        
        const response = await fetch(proxyUrl, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!response.ok) return false;

        const data = await response.json();
        const html = data.contents || "";

        // Check if ngrok is throwing a tunnel error
        const isNgrokError = 
          html.includes("ERR_NGROK_3200") || 
          html.includes("ERR_NGROK_") || 
          html.includes("is offline");

        if (isNgrokError) {
          return false;
        }

        return true;
      } catch (err) {
        clearTimeout(timeoutId);
        return false;
      }
    }

    async function redirect() {
      const messageElem = document.getElementById("status-message");

      try {
        // 1. Fetch target config from GitHub
        const configUrl = `https://raw.githubusercontent.com/JD3006/debating/main/target.json?t=${Date.now()}`;
        const response = await fetch(configUrl, { cache: "no-store" });
        
        if (!response.ok) throw new Error("Could not fetch target configuration.");
        
        const data = await response.json();

        if (!data || !data.target) {
          messageElem.innerText = "the website is down pls contact me";
          return;
        }

        // 2. Check if the ngrok endpoint is actually active
        const siteIsAvailable = await isWebsiteUp(data.target);

        if (siteIsAvailable) {
          window.location.replace(data.target);
        } else {
          messageElem.innerText = "the website is down pls contact me";
        }
      } catch (err) {
        console.error(err);
        messageElem.innerText = "the website is down pls contact me";
      }
    }

    window.addEventListener("DOMContentLoaded", redirect);
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">
  <p id="status-message">Checking website availability...</p>
</body>
</html>
