<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    // 1. Fetch latest target from GitHub instantly (no 5-minute CDN cache)
    async function getLatestTarget() {
      try {
        const apiUrl = `https://api.github.com/repos/JD3006/debating/contents/target.json?t=${Date.now()}`;
        const apiRes = await fetch(apiUrl, {
          cache: "no-store",
          headers: { "Accept": "application/vnd.github.v3.raw" }
        });

        if (apiRes.ok) {
          const json = await apiRes.json();
          if (json && json.target) return json.target;
        }
      } catch (e) {
        console.warn("[DEBUG] GitHub API failed, using raw fallback...", e);
      }

      const rawUrl = `https://raw.githubusercontent.com/JD3006/debating/main/target.json?t=${Date.now()}`;
      const rawRes = await fetch(rawUrl, { cache: "no-store" });
      const rawJson = await rawRes.json();
      return rawJson?.target;
    }

    // 2. Health check that works locally for both normal sites and ngrok
    async function isTargetOnline(url) {
      const isNgrok = url.includes("ngrok");

      if (isNgrok) {
        console.log("[DEBUG] Detected ngrok target. Inspecting tunnel status...");
        try {
          // Free open-source check for ngrok error codes (No API Key required)
          const checkUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}&t=${Date.now()}`;
          const res = await fetch(checkUrl);

          if (!res.ok) return false;

          const data = await res.json();
          const httpCode = data.status ? data.status.http_code : 200;
          const contents = (data.contents || "").toLowerCase();

          // Check if ngrok is returning 404 or tunnel down error
          if (httpCode >= 400 || contents.includes("err_ngrok_") || contents.includes("is offline")) {
            console.warn(`[DEBUG] ngrok tunnel is OFFLINE (Status: ${httpCode}, ERR_NGROK detected).`);
            return false;
          }

          console.log("[DEBUG] ngrok tunnel is ACTIVE and responded 200 OK!");
          return true;
        } catch (err) {
          console.warn("[DEBUG] ngrok inspection failed:", err);
          return false;
        }
      } else {
        console.log("[DEBUG] Detected standard web target. Probing connection directly...");
        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 5000);

          // Standard no-cors probe: No custom headers = No preflight OPTIONS CORS blocks
          await fetch(url, {
            method: "GET",
            mode: "no-cors",
            cache: "no-store",
            signal: controller.signal
          });

          clearTimeout(timeout);
          console.log("[DEBUG] Target server reached successfully!");
          return true;
        } catch (err) {
          console.warn("[DEBUG] Direct probe failed (DNS or server unreachable):", err.message);
          return false;
        }
      }
    }

    async function checkAndRedirect() {
      const statusElem = document.getElementById("status-message");

      console.log("%c[DEBUG] Starting redirect check...", "color: #3b82f6; font-weight: bold;");

      try {
        statusElem.innerText = "Fetching redirect target...";
        //await sleep(400);

        const targetUrl = await getLatestTarget();

        if (!targetUrl) {
          throw new Error("Target URL is missing in target.json");
        }

        console.log(`%c[DEBUG] Target URL: ${targetUrl}`, "color: #10b981; font-weight: bold;");

        statusElem.innerText = "Checking if website is online...";
        //await sleep(600);

        const isOnline = await isTargetOnline(targetUrl);

        //await sleep(400);

        if (isOnline) {
          console.log("%c[DEBUG] Status: ONLINE. Redirecting now...", "color: #10b981; font-weight: bold;");
          statusElem.innerText = "Website is online! Redirecting...";
          //await sleep(500);
          window.location.replace(targetUrl);
        } else {
          console.log("%c[DEBUG] Status: OFFLINE. Showing error message.", "color: #ef4444; font-weight: bold;");
          statusElem.innerText = "the website is down pls contact me";
        }

      } catch (err) {
        console.error("%c[DEBUG] Error:", "color: #ef4444;", err.message);
        statusElem.innerText = "the website is down pls contact me";
      }
    }

    window.addEventListener("DOMContentLoaded", checkAndRedirect);
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 60px;">
  <p id="status-message" style="font-size: 1.2rem; color: #333;">Initializing...</p>
</body>
</html>
