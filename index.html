<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    async function redirect() {
      try {
        const url = `https://raw.githubusercontent.com/JD3006/debating/main/target.json?t=${new Date().getTime()}`;
        
        const response = await fetch(url, { cache: "no-store" });
        const data = await response.json();

        if (data && data.target) {
          window.location.replace(data.target);
        } else {
          document.body.innerText = "Target URL not set.";
        }
      } catch (err) {
        document.body.innerText = "Failed to load redirect target.";
        console.error(err);
      }
    }
    redirect();
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">
  <p></p>
</body>
</html>
