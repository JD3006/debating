<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    async function checkAndRedirect() {
      const statusElem = document.getElementById("status-message");

      console.log("%c[DEBUG] Starting health check...", "color: #3b82f6; font-weight: bold;");

      try {
        // --- STEP 1: Fetch target URL from GitHub ---
        statusElem.innerText = "Fetching redirect target...";
        console.log("[DEBUG] Step 1: Requesting target.json from GitHub...");
        //await sleep(500); // UI delay for readability

        const configUrl = `https://raw.githubusercontent.com/JD3006/debating/main/target.json?t=${Date.now()}`;
        const configRes = await fetch(configUrl, { cache: "no-store" });

        if (!configRes.ok) {
          throw new Error(`Failed to load target.json (HTTP ${configRes.status})`);
        }

        const data = await configRes.json();
        const targetUrl = data?.target;

        if (!targetUrl) {
          throw new Error("Target URL is missing in target.json");
        }

        console.log(`%c[DEBUG] Target URL found: ${targetUrl}`, "color: #10b981;");

        // --- STEP 2: Probe the ngrok server locally ---
        statusElem.innerText = "Checking if website is online...";
        console.log("[DEBUG] Step 2: Probing ngrok endpoint directly...");
        //await sleep(800);

        let isOnline = false;

        try {
          const probeController = new AbortController();
          const timeout = setTimeout(() => probeController.abort(), 6000);

          // Direct fetch sending the ngrok warning bypass header
          const probeRes = await fetch(targetUrl, {
            method: "GET",
            headers: {
              "ngrok-skip-browser-warning": "69420"
            },
            signal: probeController.signal
          });

          clearTimeout(timeout);
          console.log(`[DEBUG] Received HTTP Status: ${probeRes.status}`);

          // If ngrok is offline, it returns 404 (ERR_NGROK_3200) or 503
          if (probeRes.ok) {
            console.log("%c[DEBUG] HTTP Status 200 received! Server is UP.", "color: #10b981; font-weight: bold;");
            isOnline = true;
          } else {
            console.warn(`[DEBUG] Server returned error status: ${probeRes.status}. ngrok tunnel is offline.`);
            isOnline = false;
          }
        } catch (fetchErr) {
          // When ngrok returns 404/ERR_NGROK_3200 without CORS headers, browser fetch rejects
          console.warn("[DEBUG] Direct probe failed or rejected (ngrok is offline or unreachable):", fetchErr.message);
          isOnline = false;
        }

        // --- STEP 3: Decision & Action ---
        //await sleep(500);

        if (isOnline) {
          console.log("%c[DEBUG] All checks passed. Redirecting to destination...", "color: #10b981; font-weight: bold;");
          statusElem.innerText = "Website is online! Redirecting...";
          //await sleep(600);
          window.location.replace(targetUrl);
        } else {
          console.log("%c[DEBUG] Website is DOWN. Aborting redirect.", "color: #ef4444; font-weight: bold;");
          statusElem.innerText = "the website is down pls contact me";
        }

      } catch (err) {
        console.error("%c[DEBUG] Critical failure during check:", "color: #ef4444;", err.message);
        statusElem.innerText = "the website is down pls contact me";
      }
    }

    window.addEventListener("DOMContentLoaded", checkAndRedirect);
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 60px;">
  <p id="status-message" style="font-size: 1.2rem; color: #333;">Initializing...</p>
</body>
</html>
